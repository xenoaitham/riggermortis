name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install core (editable, with dev tools)
        run: make install PY=python
      - name: Lint (ruff)
        run: make lint PY=python
      - name: Test suite
        run: make test PY=python
      - name: Network audit under kernel-level isolation (3.11 only, best-effort)
        if: matrix.python == '3.11'
        run: |
          if sudo unshare -n true 2>/dev/null; then
            sudo unshare -n -- env PATH="$PATH" bash -c \
              "cd core && python -m pytest tests/test_network_audit.py -q"
            echo "unshare -n: network-audit PASS (no interfaces available at all)"
          else
            echo "unshare -n unavailable in this environment; the in-process audit-hook test (run above) is the enforcement"
          fi

  blender-gate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"  # matches Blender 4.x bundled Python
      - name: >-
          Install Blender (ubuntu-24.04 ships 4.0.2 — deliberate CI pin, D-014:
          the dev box runs 5.1.0 and both gates were re-verified there with
          identical numbers; 4.0.2 exercises the oldest supported apt path)
        run: |
          sudo apt-get update
          # python3-numpy: the apt Blender 4.0.2 glTF exporter imports numpy
          # and the apt build does NOT bundle it (Blender 5.x does — the dev
          # box gate passes without this). Without it the export gate
          # degrades to an honest per-format SKIP.
          sudo apt-get install -y blender python3-numpy
          blender --version | head -1
      - name: Install core
        run: make install PY=python
      - name: Blender end-to-end gate (bridge → strict map → add-on registers)
        run: make blender-verify
      - name: >-
          Export round-trip gate (FBX + glTF via builtin exporters; self-
          contained — no models/assets. D-014 note: verified on the dev box's
          5.1.0 with ~0.02 deg round-trip error; CI exercises it on 4.0.2,
          where Action.fcurves uses the pre-5.x API the probe handles)
        run: make export-verify
      - name: >-
          Session-bridge gate (P3-5: MCP server loopback <-> REAL Blender
          add-on client, enqueue -> execute -> structured result; self-
          contained — no models/assets, 127.0.0.1 only)
        run: make session-verify

  media-guard:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: No hand-made media committed (demo media is generated headlessly)
        run: make media-guard
