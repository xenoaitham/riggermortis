name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install core (editable, with dev tools)
        run: make install PY=python
      - name: Lint (ruff)
        run: make lint PY=python
      - name: Test suite
        run: make test PY=python
      - name: Network audit under kernel-level isolation (3.11 only, best-effort)
        if: matrix.python == '3.11'
        run: |
          if sudo unshare -n true 2>/dev/null; then
            sudo unshare -n -- env PATH="$PATH" bash -c \
              "cd core && python -m pytest tests/test_network_audit.py -q"
            echo "unshare -n: network-audit PASS (no interfaces available at all)"
          else
            echo "unshare -n unavailable in this environment; the in-process audit-hook test (run above) is the enforcement"
          fi

  blender-gate:
    runs-on: ubuntu-24.04
    env:
      # The gates' env-var interface (BLENDER=... ) is unchanged; CI now
      # points it at the official 5.1.0 tarball instead of an apt pin.
      BLENDER: ${{ github.workspace }}/blender-5.1.0-linux-x64/blender
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # The rigpose CLI / make install side. Blender 5.1 bundles its own
          # Python (3.13) — the gates invoke "$BLENDER -b --python", which
          # uses that bundled interpreter regardless of this pin.
          python-version: "3.11"
      - name: >-
          Restore Blender 5.1.0 (official linux-x64 tarball, cache keyed on
          the version string). D-014 EXECUTED 2026-09-20 S15: every Phase-4
          style-gate half exercised only its SKIPPED path on the apt 4.0.2
          pin, so CI now runs the SAME full gate as the dev box — real
          EEVEE pixels on llvmpipe. The honest SKIPPED degradation paths
          STAY in the gate code (older-Blender/dev-box honesty); CI simply
          no longer takes them.
        uses: actions/cache@v4
        with:
          path: blender-5.1.0-linux-x64
          key: blender-5.1.0-linux-x64
      - name: Download Blender 5.1.0 tarball (no-op on a cache hit)
        run: |
          if [ ! -x "$BLENDER" ]; then
            curl -fsSL --retry 3 -o /tmp/blender.tar.xz \
              https://download.blender.org/release/Blender5.1/blender-5.1.0-linux-x64.tar.xz
            tar -xJf /tmp/blender.tar.xz
          fi
          "$BLENDER" --version | head -1
      - name: Install GL + numpy support (headless EEVEE on llvmpipe)
        run: |
          sudo apt-get update
          # libegl1/libgl1/libgl1-mesa-dri: the runner has no GPU; every
          # gate render (blender-gate turntable since P3-7, export round-
          # trip, style-gate EEVEE frames) runs on llvmpipe software GL.
          # Without libEGL.so.1 Blender aborts (core dump).
          # python3-numpy: the apt-4.0.2-era export-gate fix, KEPT per the
          # D-014 work order — Blender 5.1 bundles numpy, so this is
          # harmless belt-and-suspenders, and the glTF exporter gate never
          # degrades to a SKIP over it either way.
          # ffmpeg/ffprobe (P4-8, S16): raises the style gate's animatic
          # assembly half from its designed SKIPPED to PASS on CI — the
          # same expectation-rise pattern as D-014 (the deterministic
          # frames still gate without it; this adds the movie parse-back).
          sudo apt-get install -y python3-numpy libegl1 libgl1 libgl1-mesa-dri ffmpeg
      - name: Install core
        run: make install PY=python
      - name: Blender end-to-end gate (bridge → strict map → add-on registers)
        run: make blender-verify
      - name: >-
          Export round-trip gate (FBX + glTF via builtin exporters; self-
          contained — no models/assets. Verified on the dev box's 5.1.0
          with ~0.02 deg round-trip error; CI now exercises it on the same
          5.1.0 tarball, where Action.fcurves uses the 5.x slotted API the
          probe also handles on pre-5.x)
        run: make export-verify
      - name: >-
          Session-bridge gate (P3-5: MCP server loopback <-> REAL Blender
          add-on client, enqueue -> execute -> structured result; self-
          contained — no models/assets, 127.0.0.1 only)
        run: make session-verify
      - name: >-
          Style gate (P4-1..P4-6: toon materials, GPv3 line art, screentones,
          pages, bubbles, PDF/EPUB export). On 5.1 the LINEART/TONES/PAGES/
          EXPORT halves must report PASS — the D-014 bump is exactly that
          expectation rising to match the dev box. The SKIPPED degradation
          paths stay in the gate code for older Blenders; if CI shows
          SKIPPED here, the bump failed, not the gate.
        run: make style-verify

  media-guard:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: No hand-made media committed (demo media is generated headlessly)
        run: make media-guard
