[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "riggermortis-core"
version = "0.0.1"
description = "Local, rig-agnostic posing & animation engine: canonical skeleton, bone-role mapping, presets, content policy. No cloud, no telemetry."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Riggermortis contributors" }]
keywords = ["blender", "rigging", "retargeting", "pose-estimation", "mcp", "animation"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Graphics :: 3D Modeling",
    "Operating System :: OS Independent",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.4"]

[project.scripts]
rigpose = "riggermortis.cli:main"

[project.urls]
Homepage = "https://github.com/riggermortis/riggermortis"
Issues = "https://github.com/riggermortis/riggermortis/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
riggermortis = ["bridge/*.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]
